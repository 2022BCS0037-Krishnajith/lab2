name: Lab 2 - Automated Model Training

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install required dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Execute the training script
      - name: Run training script
        run: |
          python train.py

      # 5. Write metrics to GitHub Actions Job Summary
      - name: Write evaluation metrics to Job Summary
        run: |
          echo "## 📊 Model Evaluation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Name:** Krishnajith K S" >> $GITHUB_STEP_SUMMARY
          echo "**Roll Number:** 2022BCS0037" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Metrics" >> $GITHUB_STEP_SUMMARY
          cat output/results.json >> $GITHUB_STEP_SUMMARY

      # 6. Upload artifacts (model + results)
      - name: Upload trained model and results
        uses: actions/upload-artifact@v4
        with:
          name: lab2-model-and-metrics
          path: output/
